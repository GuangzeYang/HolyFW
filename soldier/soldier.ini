[commander]
; Report commander address (where task completion reports are sent)
; ip or host - IP address or hostname (default: 127.0.0.1)
; port - port number (default: 38471)
ip = 127.0.0.1
port = 38471

[listen]
; Local listen address for task dispatch
; bind - bind address (default: 0.0.0.0)
; port - listen port (default: 38472)
bind = 0.0.0.0
port = 38472

[exec]
; Execution settings
; timeout - command timeout in seconds (default: 3600)
timeout = 3600